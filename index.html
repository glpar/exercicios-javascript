<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Exercícios práticos de JavaScript desenvolvidos por GLPAR."
    />
    <title>Exercícios JavaScript | GLPAR</title>
    <style>
      :root {
        color: #f8fafc;
        background: #09090b;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at top, rgba(124, 58, 237, 0.22), transparent 38rem),
          #09090b;
      }

      main {
        width: min(900px, 100%);
      }

      span {
        color: #a78bfa;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.75rem 0;
        font-size: clamp(2.25rem, 7vw, 4.5rem);
        line-height: 1;
      }

      p {
        max-width: 640px;
        color: #a1a1aa;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      nav {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 1rem;
        margin-top: 2.5rem;
      }

      a {
        min-height: 130px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.25rem;
        border: 1px solid #27272a;
        border-radius: 1rem;
        color: inherit;
        background: rgba(24, 24, 27, 0.78);
        text-decoration: none;
        transition: 180ms ease;
      }

      a:hover,
      a:focus-visible {
        border-color: #8b5cf6;
        transform: translateY(-4px);
        outline: none;
      }

      strong {
        font-size: 1.15rem;
      }

      small {
        color: #71717a;
      }

      @media (max-height: 650px) {
        body {
          place-items: start center;
          padding: 1.25rem;
        }

        h1 {
          font-size: clamp(2rem, 6vw, 3.5rem);
        }

        p {
          margin-block: 0.5rem;
          line-height: 1.5;
        }

        nav {
          margin-top: 1.25rem;
        }

        a {
          min-height: 96px;
          padding: 1rem;
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 1rem;
        }

        nav {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span>GLPAR Labs</span>
      <h1>Exercícios JavaScript</h1>
      <p>
        Uma coleção de pequenos projetos para praticar lógica, interação com o
        navegador e os fundamentos da linguagem JavaScript.
      </p>

      <nav aria-label="Lista de exercícios">
        <a href="./teste1/">
          <strong>Exercício 01</strong>
          <small>Abrir projeto →</small>
        </a>
        <a href="./teste2/">
          <strong>Exercício 02</strong>
          <small>Abrir projeto →</small>
        </a>
        <a href="./teste3/">
          <strong>Exercício 03</strong>
          <small>Abrir projeto →</small>
        </a>
        <a href="./teste4/">
          <strong>Exercício 04</strong>
          <small>Abrir projeto →</small>
        </a>
      </nav>
    </main>
  </body>
</html>
